<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Team.Notes - Calendar</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,wght@0,400;1,400&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@300,0&display=swap" rel="stylesheet"/>
    <style>
        body { background-color: #fcf9f2; font-family: 'Work Sans', sans-serif; min-height: 100vh; }
        .paper-shadow { box-shadow: 0px 2px 4px rgba(0, 0, 0, 0.05); }
        .ink-border { border: 1px solid #E6E4DD; }
        .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); }
    </style>
</head>
<body class="text-stone-900 pb-24">
    <header class="flex justify-between items-center px-6 py-4 bg-[#F9F8F4] border-b border-[#E6E4DD]">
        <div class="flex items-center gap-4">
            <span class="material-symbols-outlined">menu</span>
            <h1 class="font-serif italic text-xl font-semibold tracking-tight">Team.Notes</h1>
        </div>
    </header>

    <main class="max-w-[720px] mx-auto px-6 pt-8">
        <div class="flex items-center justify-between mb-6">
            <div>
                <h2 class="text-4xl font-serif">October 2023</h2>
                <p class="text-stone-500">Team availability</p>
            </div>
        </div>

        <div class="bg-white ink-border rounded-xl paper-shadow overflow-hidden mb-8">
            <div class="calendar-grid border-b border-[#E6E4DD] bg-stone-50">
                <div class="p-3 text-center text-xs text-stone-500">LUN</div>
                <div class="p-3 text-center text-xs text-stone-500">MAR</div>
                <div class="p-3 text-center text-xs text-stone-500">MER</div>
                <div class="p-3 text-center text-xs text-stone-500">GIO</div>
                <div class="p-3 text-center text-xs text-stone-500">VEN</div>
                <div class="p-3 text-center text-xs text-stone-500">SAB</div>
                <div class="p-3 text-center text-xs text-stone-500">DOM</div>
            </div>
            <div class="calendar-grid text-center">
                <div class="h-16 p-2 border-r border-b border-[#E6E4DD]">1</div>
                <div class="h-16 p-2 border-r border-b border-[#E6E4DD]">2</div>
                <div class="h-16 p-2 border-r border-b border-[#E6E4DD]">3</div>
                <div class="h-16 p-2 border-r border-b border-[#E6E4DD]">4</div>
                <div class="h-16 p-2 border-r border-b border-[#E6E4DD]">5</div>
                <div class="h-16 p-2 border-r border-b border-[#E6E4DD]">6</div>
                <div class="h-16 p-2 border-b border-[#E6E4DD]">7</div>
                <div class="h-16 p-2 border-r border-b border-[#E6E4DD]">8</div>
                <div class="h-16 p-2 border-r border-b border-[#E6E4DD]">9</div>
                <div class="h-16 p-2 border-r border-b border-[#E6E4DD]">10</div>
                <div class="h-16 p-2 border-r border-b border-[#E6E4DD] bg-stone-800 text-white font-bold">11</div>
                <div class="h-16 p-2 border-r border-b border-[#E6E4DD]">12</div>
                <div class="h-16 p-2 border-r border-b border-[#E6E4DD]">13</div>
                <div class="h-16 p-2 border-b border-[#E6E4DD]">14</div>
            </div>
        </div>
    </main>

    <nav class="fixed bottom-0 left-0 w-full flex justify-around items-center bg-[#F9F8F4] border-t border-[#E6E4DD] h-20">
        <a href="index" class="flex flex-col items-center text-stone-400"><span class="material-symbols-outlined">dashboard</span><span class="text-[10px] uppercase">Home</span></a>
        <a href="calendario" class="flex flex-col items-center text-stone-900"><span class="material-symbols-outlined">calendar_month</span><span class="text-[10px] uppercase">Calendar</span></a>
        <a href="obiettivi" class="flex flex-col items-center text-stone-400"><span class="material-symbols-outlined">edit_note</span><span class="text-[10px] uppercase">Goals</span></a>
        <a href="profilo" class="flex flex-col items-center text-stone-400"><span class="material-symbols-outlined">person</span><span class="text-[10px] uppercase">Profile</span></a>
    </nav>
</body>
</html>
