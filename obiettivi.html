<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Team.Notes - Goals</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,200..800;1,6..72,200..800&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Work Sans', sans-serif; background-color: #fcf9f2; }
        .font-serif { font-family: 'Newsreader', serif; }
        .paper-lines { background-image: linear-gradient(#e4e2db 1px, transparent 1px); background-size: 100% 32px; }
    </style>
</head>
<body class="pb-32">
    <header class="bg-[#F9F8F4] border-b border-[#E6E4DD] flex justify-between items-center px-6 py-4 sticky top-0 z-50">
        <h1 class="text-xl font-serif font-semibold italic">Team.Notes</h1>
        <a href="cms" class="text-xs border border-stone-800 px-2 py-1 uppercase">Admin CMS</a>
    </header>

    <main class="max-w-[720px] mx-auto px-6 py-12">
        <section class="mb-12">
            <span class="text-[11px] font-bold text-stone-400 uppercase tracking-widest">Q4 Milestones</span>
            <h2 class="text-4xl font-serif mt-2">Goals Board</h2>
            <div class="h-[1px] bg-stone-200 w-full mt-4"></div>
        </section>

        <div class="bg-white border border-[#E6E4DD] shadow-sm relative overflow-hidden">
            <div class="absolute left-0 top-0 bottom-0 w-1 bg-stone-800"></div>
            <div id="dynamicTaskList" class="paper-lines px-4 py-2 min-h-[200px]">
                </div>
        </div>
    </main>

    <nav class="fixed bottom-0 left-0 w-full bg-[#F9F8F4]/90 backdrop-blur-sm border-t border-[#E6E4DD] flex justify-around p-4 h-20">
        <a href="index" class="flex flex-col items-center text-stone-400"><span class="material-symbols-outlined">dashboard</span><span class="text-[10px] uppercase">Home</span></a>
        <a href="obiettivi" class="flex flex-col items-center text-stone-900"><span class="material-symbols-outlined">edit_note</span><span class="text-[10px] uppercase">Goals</span></a>
        <a href="profilo" class="flex flex-col items-center text-stone-400"><span class="material-symbols-outlined">person</span><span class="text-[10px] uppercase">Profile</span></a>
    </nav>

    <script>
        function loadTasks() {
            const container = document.getElementById('dynamicTaskList');
            const tasks = JSON.parse(localStorage.getItem('team_tasks')) || [];
            const colors = { Alex: 'bg-blue-400', Sarah: 'bg-emerald-400', David: 'bg-amber-400', Maria: 'bg-rose-400' };

            if (tasks.length === 0) {
                container.innerHTML = '<p class="py-4 text-stone-400 italic">Nessuna task attiva. Usa il CMS per aggiungerle.</p>';
                return;
            }

            container.innerHTML = tasks.map(task => `
                <div class="flex items-center min-h-[32px] py-1 border-b border-stone-100 last:border-0">
                    <span class="material-symbols-outlined text-stone-300 text-sm">check_box_outline_blank</span>
                    <span class="flex-grow text-sm ml-3 text-stone-800">${task.title}</span>
                    <div class="w-2 h-2 rounded-full ${colors[task.member] || 'bg-stone-300'}" title="${task.member}"></div>
                </div>
            `).join('');
        }
        loadTasks();
    </script>
</body>
</html>
