<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Team.Notes - Profile</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,wght@0,400;1,400&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@300,0&display=swap" rel="stylesheet"/>
    <style>
        body { background-color: #fcf9f2; font-family: 'Work Sans', sans-serif; min-height: 100vh; }
    </style>
</head>
<body class="text-stone-900 pb-24">
    <header class="flex justify-between items-center px-6 py-4 bg-[#F9F8F4] border-b border-[#E6E4DD]">
        <div class="flex items-center gap-4">
            <span class="material-symbols-outlined">menu</span>
            <h1 class="font-serif italic text-xl font-semibold tracking-tight">Team.Notes</h1>
        </div>
    </header>

    <main class="max-w-[720px] mx-auto px-6 pt-8">
        <section class="mb-8">
            <h2 class="text-4xl font-serif mb-2">Team Identity</h2>
            <p class="text-stone-500">Definisci i membri del tuo team.</p>
        </section>

        <section class="space-y-4 mb-8">
            <div class="bg-white border border-[#E6E4DD] p-6 border-l-4 border-l-blue-400">
                <label class="text-xs text-stone-500 uppercase block mb-1">Membro 01</label>
                <input class="w-full bg-transparent border-b border-stone-200 py-2 text-xl outline-none" value="Alex Thompson" type="text"/>
            </div>
            <div class="bg-white border border-[#E6E4DD] p-6 border-l-4 border-l-rose-400">
                <label class="text-xs text-stone-500 uppercase block mb-1">Membro 02</label>
                <input class="w-full bg-transparent border-b border-stone-200 py-2 text-xl outline-none" value="Maria Rossi" type="text"/>
            </div>
        </section>
    </main>

    <nav class="fixed bottom-0 left-0 w-full flex justify-around items-center bg-[#F9F8F4] border-t border-[#E6E4DD] h-20">
        <a href="index" class="flex flex-col items-center text-stone-400"><span class="material-symbols-outlined">dashboard</span><span class="text-[10px] uppercase">Home</span></a>
        <a href="calendario" class="flex flex-col items-center text-stone-400"><span class="material-symbols-outlined">calendar_month</span><span class="text-[10px] uppercase">Calendar</span></a>
        <a href="obiettivi" class="flex flex-col items-center text-stone-400"><span class="material-symbols-outlined">edit_note</span><span class="text-[10px] uppercase">Goals</span></a>
        <a href="profilo" class="flex flex-col items-center text-stone-900"><span class="material-symbols-outlined">person</span><span class="text-[10px] uppercase">Profile</span></a>
    </nav>
